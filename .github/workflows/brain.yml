name: Candil brain (Modal)
on:
  push:
    branches: [main]
    paths: ['brain/**', '.github/workflows/brain.yml']
  workflow_dispatch:
    inputs:
      task:
        description: 'deploy, setup-library, build-index, ask, trial (questions separated by |) probe-pack (question = pack id), setup-full (question = docs or zims), job-logs or stop-job (question = app id), encyclopedias, setup-medium'
        default: deploy
      question:
        description: 'question for ask'
        default: 'The Wi-Fi is out. What should I do?'
      tier:
        description: 'quick or deep'
        default: quick
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check the Modal token is set
        run: test -n "$MODAL_TOKEN_ID" || { echo "Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET under Settings > Secrets and variables > Actions"; exit 1; }
      - run: pip install modal
      - name: Library in the Modal volume (downloads only the first time)
        if: github.event_name == 'push' || inputs.task == 'deploy' || inputs.task == 'setup-library'
        run: modal run brain/candil_brain.py::ensure_library
      - name: Deploy
        if: github.event_name == 'push' || inputs.task == 'deploy'
        run: modal deploy brain/candil_brain.py
      - name: Retire containers still running the previous version
        if: github.event_name == 'push' || inputs.task == 'deploy'
        run: python3 .github/retire.py
      - name: Ask one question
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'ask'
        env:
          Q: ${{ inputs.question }}
          TIER: ${{ inputs.tier }}
        run: modal run brain/candil_brain.py::smoke --question "$Q" --tier "$TIER"
      - name: Build the meaning-based search index
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-index'
        run: modal run brain/candil_brain.py::build_index
      - name: Retire containers so they load the new index
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-index'
        run: python3 .github/retire.py
      - name: Try several questions
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'trial'
        env:
          Q: ${{ inputs.question }}
          TIER: ${{ inputs.tier }}
        run: modal run brain/candil_brain.py::trial --questions "$Q" --tier "$TIER"
      - name: Look inside a library pack (no download)
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-pack'
        env:
          PACK: ${{ inputs.question }}
        run: |
          case "$PACK" in
            status) python3 brain/lastbook_pack.py status ;;
            rangespeed-*) python3 brain/lastbook_pack.py speed "${PACK#rangespeed-}" 30000000000 ;;
            speed-*) python3 brain/lastbook_pack.py speed "${PACK#speed-}" ;;
            *) python3 brain/lastbook_pack.py probe "${PACK:-all}" ;;
          esac
      - name: Fetch the full library without videos or maps, then index it
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'setup-full'
        timeout-minutes: 340
        env:
          PHASE: ${{ inputs.question }}
        run: modal run --detach brain/candil_brain.py::setup_full_library --phase "${PHASE:-docs}"
      - name: Show a running job's latest log lines
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'job-logs'
        env:
          APP: ${{ inputs.question }}
        run: |
          modal container list --json > c.json || echo '[]' > c.json
          python3 - <<'PY'
          import json, os, subprocess
          app = os.environ['APP']
          if app in ('', 'latest'):   # the running download or index job (an ephemeral app), never the live brain
              apps = json.loads(subprocess.run(['modal', 'app', 'list', '--json'], capture_output=True, text=True).stdout or '[]')
              jobs = [a for a in apps if a.get('description') == 'candil-brain' and str(a.get('state', '')).startswith('ephemeral')]
              wanted = {j['app_id'] for j in jobs}
              print('running jobs:', wanted or 'none', flush=True)
          else:
              wanted = {app}
          found = False
          for c in json.load(open('c.json')):
              if c.get('app_id') in wanted:
                  found = True
                  print('=== container', c.get('container_id'), 'of', c.get('app_id'), 'started', c.get('start_time'), flush=True)
                  subprocess.run(['modal', 'container', 'logs', c['container_id'], '-n', '60', '--timestamps'])
          if not found:
              print('no running container for', app)
              subprocess.run(['modal', 'app', 'list'])
          PY
      - name: Stop a running job
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'stop-job'
        env:
          APP: ${{ inputs.question }}
        run: |
          modal app list --json > apps.json
          python3 - <<'PY'
          import json, os, sys
          app = [a for a in json.load(open('apps.json')) if a.get('app_id') == os.environ['APP']]
          if not app or app[0].get('state') == 'deployed':
              sys.exit(f'refusing: {os.environ["APP"]} is not a running job (it may be the live brain)')
          print('stopping', app[0])
          PY
          modal app stop --yes "$APP"
      - name: Fetch the encyclopedias from Kiwix
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'encyclopedias'
        timeout-minutes: 340
        run: modal run --detach brain/candil_brain.py::fetch_encyclopedias
      - name: Fetch the medium library without videos or map, then index it
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'setup-medium'
        timeout-minutes: 340
        run: modal run --detach brain/candil_brain.py::setup_medium_library
