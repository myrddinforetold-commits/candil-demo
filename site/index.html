<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candil · Live demo</title>
<meta name="description" content="Try Candil: an offline AI that answers out loud when the internet and the power are gone.">
<link rel="icon" href="./brand/candil-mark.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
@font-face{font-family:Barlow;font-weight:400;src:url(./fonts/Barlow-Regular.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:500;src:url(./fonts/Barlow-Medium.woff2) format("woff2")}
@font-face{font-family:Barlow;font-weight:600;src:url(./fonts/Barlow-SemiBold.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(./fonts/IBMPlexMono-Regular.woff2) format("woff2")}
:root{--ink:#1b1c1e;--paper:#f1eee6;--signal:#f2490f;--muted:#5f5e5a;--dim:#b9b5ab;--fg:var(--ink);--fg2:var(--muted);--panel:rgba(255,255,255,.78);--line:rgba(27,28,30,.12);--dock-h:96px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Barlow,system-ui,sans-serif;color:var(--fg);-webkit-tap-highlight-color:transparent}
html{background:#fff}body{background:transparent}
body{transition:background 1.6s ease,color 1.2s ease}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 40%,#ffffff 0%,#f6f5f2 55%,#e7e5e0 100%);z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(90% 70% at 50% 42%,#0b0c0f 0%,#030304 55%,#000 100%);opacity:0;transition:opacity 1.2s ease;z-index:-1}
body.dark{--fg:#ece8df;--fg2:#a29e95;--panel:rgba(16,17,19,.7);--line:rgba(236,232,223,.12);color:var(--fg)}
/* the moment the power goes: no easing at all, the room just goes */
body.cut,body.cut::after,body.cut *{transition:none!important}
body.dark::after{opacity:1}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;pointer-events:none;z-index:3}
.brand{display:flex;align-items:center;gap:14px;pointer-events:auto}
.brand img{height:22px;display:block}
.brand .wm-paper{display:none}body.dark .brand .wm-ink{display:none}body.dark .brand .wm-paper{display:block}
.brand span{font-size:15px;color:var(--fg2);font-weight:500;letter-spacing:.01em}
.chips{display:flex;gap:8px;pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.chip i{width:8px;height:8px;border-radius:50%;background:#3aa76d;display:block}
.chip.off i{background:#8b8a86}
.chip.off b{text-decoration:line-through;text-decoration-thickness:1.5px}
.chip b{font-weight:600}
#hud{position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;transition:opacity .8s,transform .8s;z-index:3;pointer-events:none;text-align:center}
#hud.on{opacity:1;transform:translateX(-50%)}
#hud .pill{display:inline-flex;align-items:center;gap:12px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:15px}
#hud .bat{width:34px;height:15px;border:2px solid var(--fg);border-radius:3px;position:relative}
#hud .bat::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:var(--fg);border-radius:1px}
#hud .bat i{position:absolute;left:2px;top:2px;bottom:2px;width:calc((100% - 4px)*.86);background:var(--fg)}
#hud .mono{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--fg2)}
#toast{position:fixed;top:118px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:500;padding:10px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .5s;z-index:3;pointer-events:none;max-width:min(560px,90vw);text-align:center}
#toast.on{opacity:1}
#dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:18px;padding:12px 14px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:4;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;gap:7px;flex:none}
.grp>small{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2);padding-left:4px}
.row{display:flex;gap:6px}
button{font:inherit;font-size:15px;font-weight:500;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,opacity .2s}
button:hover{border-color:var(--fg2)}
button[aria-pressed=true]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
body.dark button[aria-pressed=true]{color:#141518}
button:disabled{opacity:.42;cursor:default}
button.ask{border-color:rgba(242,73,15,.55)}
button.ask .dot{width:9px;height:9px;border-radius:50%;border:2.5px solid var(--signal);flex:none}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sep{width:1px;background:var(--line);flex:none}
#panel{position:fixed;right:18px;top:70px;bottom:120px;width:min(380px,calc(100vw - 36px));border-radius:20px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:3;padding:18px 20px;overflow:auto;transform:translateX(calc(100% + 30px));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#panel.on{transform:none}
#panel h3{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2);margin:4px 0 8px}
#panel .q{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:18px}
#panel .hl{font-size:22px;font-weight:600;line-height:1.25;margin-bottom:12px}
#panel ol{padding-left:22px;font-size:16px;line-height:1.45;margin-bottom:16px}
#panel li{margin-bottom:6px}
#panel .src{font-size:14px;color:var(--fg2);line-height:1.4;margin-bottom:14px}
#panel .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg2);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
#panel .note{font-size:13px;line-height:1.4;color:var(--fg2);background:rgba(242,73,15,.08);border:1px solid rgba(242,73,15,.25);border-radius:10px;padding:8px 10px;margin-bottom:14px}
#panel .x{position:absolute;right:12px;top:10px;border:none;font-size:20px;padding:4px 8px;color:var(--fg2)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:16px;color:var(--fg2);z-index:5;pointer-events:none}
footer{position:fixed;left:24px;bottom:max(22px,env(safe-area-inset-bottom));font-size:12px;color:var(--fg2);max-width:220px;line-height:1.35;z-index:2}
@media (max-width:900px){footer{display:none}.brand span{display:none}}
.short{display:none}
@media (max-width:700px){
  header{padding:10px 12px}.brand img{height:18px}
  .chip{font-size:12px;padding:5px 9px;gap:6px}.chip i{width:7px;height:7px}
  #hud{top:48px;width:calc(100vw - 24px)}#hud .pill{flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:13px;padding:7px 12px;border-radius:16px}
  #hud .mono{font-size:11px;width:100%}#hud .bat{width:26px;height:12px}
  #toast{top:auto;bottom:calc(var(--dock-h) + 22px);font-size:14px;width:calc(100vw - 24px)}
  #dock{left:8px;right:8px;transform:none;bottom:max(8px,env(safe-area-inset-bottom));max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px;border-radius:18px;overflow:visible}
  .sep,.grp>small,.long{display:none}.short{display:inline}
  .grp{min-width:0}.grp.ask-grp{grid-column:1/-1;order:-1}
  .row{gap:6px}.row>button{flex:1 1 0;min-width:0;justify-content:center}
  button{font-size:14px;padding:9px 8px;border-radius:11px;white-space:normal;line-height:1.15;text-align:center}
  button.ask{justify-content:flex-start;text-align:left}
  #b-mic{flex:0 0 auto}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(var(--dock-h) + 16px);max-height:40vh;padding:14px 16px;border-radius:18px;transform:translateY(calc(100% + var(--dock-h) + 40px))}
  #panel .q{font-size:16px;margin-bottom:12px}#panel .hl{font-size:18px}#panel ol{font-size:15px}
}
#b-mic{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

</style>
</head>
<body>
<div id="stage" aria-label="Interactive 3D model of Candil. Drag to turn it."></div>
<div id="loading">Loading Candil…</div>
<header>
  <div class="brand"><img class="wm-ink" src="./brand/candil-wordmark-ink.svg" alt="Candil"><img class="wm-paper" src="./brand/candil-wordmark-paper.svg" alt=""><span>Live demo</span></div>
  <div class="chips" aria-live="polite">
    <div class="chip" id="chip-net"><i></i><span>Internet <b>on</b></span></div>
    <div class="chip" id="chip-power"><i></i><span>Power <b>on</b></span></div>
  </div>
</header>
<div id="hud" aria-live="polite"><div class="pill"><span class="bat"><i></i></span><span><b>Running on its packs</b> · 86%</span><span class="mono" id="hud-est"></span></div></div>
<div id="toast" role="status"></div>

<aside id="panel" aria-live="polite"><button class="x" id="panel-x" aria-label="Close">×</button><div id="panel-body"></div></aside>

<nav id="dock" aria-label="Demo controls">
  <div class="grp"><small>The world</small><div class="row">
    <button id="b-net" aria-pressed="false">Internet<span class="long"> goes</span> out</button>
    <button id="b-power" aria-pressed="false">Power<span class="long"> goes</span> out</button>
  </div></div>
  <div class="sep"></div>
  <div class="grp"><small>Candil</small><div class="row">
    <button id="b-lid" aria-pressed="true">Lid open</button>
    <button id="b-inside" aria-pressed="false"><span class="long">Look inside</span><span class="short">Inside</span></button>
  </div></div>
  <div class="sep"></div>
  <div class="grp ask-grp"><small>Ask it</small><div class="row">
    <button class="ask" data-scenario="wifi"><span class="dot"></span><span class="long">“The Wi-Fi is out…”</span><span class="short">“Wi-Fi is out”</span></button>
    <button class="ask" data-scenario="cold"><span class="dot"></span><span class="long">“The lights are out, it’s cold…”</span><span class="short">“Power’s out, it’s cold”</span></button>
    <button id="b-mic" disabled title="Comes with the live software"><span class="dot"></span>Ask your own</button>
  </div></div>
</nav>
<footer>Demo: answers come from the Candil software running in the cloud. The device itself runs offline.</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
